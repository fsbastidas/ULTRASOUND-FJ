<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Configurador de Ecógrafos</title>
    <!-- Tailwind CSS para diseño moderno -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-100 min-h-screen p-6 font-sans">

    <div class="max-w-5xl mx-auto space-y-6">
        
        <!-- Encabezado -->
        <header class="bg-white p-6 rounded-xl shadow-sm border border-slate-200 flex flex-col md:flex-row justify-between items-start md:items-center gap-4">
            <div>
                <h1 class="text-2xl font-bold text-slate-800">Configurador de Ecógrafos</h1>
                <p class="text-slate-500 text-sm">Selecciona las aplicaciones para armar la propuesta técnica/comercial</p>
            </div>
            
            <!-- Interruptor Mostrar/Ocultar PVP -->
            <div class="flex items-center space-x-3 bg-slate-50 p-3 rounded-lg border border-slate-200">
                <span class="text-sm font-medium text-slate-700">Mostrar PVP en la tabla</span>
                <label class="relative inline-flex items-center cursor-pointer">
                    <input type="checkbox" id="togglePVP" class="sr-only peer" checked onchange="renderTabla()">
                    <div class="w-11 h-6 bg-slate-300 peer-focus:outline-none rounded-full peer peer-checked:after:translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:border-slate-300 after:border after:rounded-full after:h-5 after:w-5 after:transition-all peer-checked:bg-blue-600"></div>
                </label>
            </div>
        </header>

        <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
            
            <!-- Panel Lateral: Selección de Modelo y Aplicaciones -->
            <div class="bg-white p-6 rounded-xl shadow-sm border border-slate-200 space-y-6">
                
                <!-- 1. Selección de Ecógrafo -->
                <div>
                    <label class="block text-sm font-semibold text-slate-700 mb-2">1. Selecciona el Ecógrafo</label>
                    <select id="selectModelo" onchange="cargarComponentes()" class="w-full p-2.5 border border-slate-300 rounded-lg focus:ring-2 focus:ring-blue-500 text-sm bg-white">
                        <option value="ARIETTA_750">ARIETTA 750 SE</option>
                        <option value="ARIETTA_650">ARIETTA 650</option>
                    </select>
                </div>

                <!-- 2. Lista de Aplicaciones / Licencias / Transductores -->
                <div>
                    <label class="block text-sm font-semibold text-slate-700 mb-2">2. Selecciona Aplicaciones y Licencias</label>
                    <div id="listaCheckboxes" class="space-y-3 max-h-80 overflow-y-auto pr-1">
                        <!-- Se llena dinámicamente -->
                    </div>
                </div>

            </div>

            <!-- Panel Principal: Tabla Resultante -->
            <div class="md:col-span-2 bg-white p-6 rounded-xl shadow-sm border border-slate-200 space-y-4">
                <div class="flex justify-between items-center">
                    <h2 class="text-lg font-bold text-slate-800">Configuración Seleccionada</h2>
                    <button onclick="copiarResumen()" class="bg-slate-800 hover:bg-slate-900 text-white text-xs px-3 py-2 rounded-lg transition-colors">
                        📋 Copiar Tabla
                    </button>
                </div>

                <div class="overflow-x-auto">
                    <table class="w-full text-sm text-left text-slate-600 border-collapse">
                        <thead class="text-xs text-slate-700 uppercase bg-slate-50 border-b border-slate-200">
                            <tr>
                                <th class="py-3 px-4">#</th>
                                <th class="py-3 px-4">Aplicación / Componente</th>
                                <th class="py-3 px-4">Modelo / Código</th>
                                <th id="colHeaderPVP" class="py-3 px-4 text-right">PVP</th>
                            </tr>
                        </thead>
                        <tbody id="bodyTabla">
                            <!-- Se llena dinámicamente -->
                        </tbody>
                        <tfoot id="footTabla" class="border-t-2 border-slate-200 font-bold text-slate-800">
                            <!-- Se llena dinámicamente con el Total -->
                        </tfoot>
                    </table>
                </div>
            </div>

        </div>
    </div>

    <!-- Script con los datos de ejemplo -->
    <script>
        // Datos de ejemplo cruzando Aplicación -> Código -> PVP (simulando tu Excel y Cotizaciones)
        const baseDeDatos = {
            ARIETTA_750: [
                { id: "abd", categoria: "Aplicación", nombre: "Aplicación Abdominal y Digestivo", codigo: "EZ-ABD-A750", pvp: 1200 },
                { id: "card", categoria: "Aplicación", nombre: "Paquete Cardiológico Avanzado", codigo: "EZ-CARD-A750", pvp: 2500 },
                { id: "vasc", categoria: "Aplicación", nombre: "Estudio Vascular periférico", codigo: "EZ-VASC-A750", pvp: 950 },
                { id: "obs", categoria: "Aplicación", nombre: "Obstetricia / Ginecología & 3D/4D", codigo: "EZ-OBGYN-A750", pvp: 1800 },
                { id: "elasto", categoria: "Licencia / Software", nombre: "Elastografía Tisular (RTE)", codigo: "LIC-ELAST-01", pvp: 3100 },
                { id: "trans_convex", categoria: "Transductor", nombre: "Transductor Convexo C252", codigo: "PROBE-C252", pvp: 4500 }
            ],
            ARIETTA_650: [
                { id: "abd650", categoria: "Aplicación", nombre: "Aplicación Abdominal General", codigo: "EZ-ABD-A650", pvp: 1000 },
                { id: "card650", categoria: "Aplicación", nombre: "Ecocardiografía Básica", codigo: "EZ-CARD-A650", pvp: 1900 },
                { id: "vasc650", categoria: "Aplicación", nombre: "Evaluación Vascular Doppler", codigo: "EZ-VASC-A650", pvp: 850 }
            ]
        };

        let seleccionados = [];

        function cargarComponentes() {
            const modelo = document.getElementById("selectModelo").value;
            const items = baseDeDatos[modelo];
            const contenedor = document.getElementById("listaCheckboxes");
            contenedor.innerHTML = "";

            // Seleccionar los 3 primeros por defecto
            seleccionados = items.slice(0, 3).map(i => i.id);

            items.forEach(item => {
                const isChecked = seleccionados.includes(item.id) ? "checked" : "";
                const div = document.createElement("div");
                div.className = "flex items-start space-x-3 p-2 hover:bg-slate-50 rounded-lg cursor-pointer";
                div.innerHTML = `
                    <input type="checkbox" id="chk_${item.id}" value="${item.id}" ${isChecked} onchange="toggleSeleccion('${item.id}')" class="mt-1 h-4 w-4 text-blue-600 rounded border-slate-300 focus:ring-blue-500">
                    <label for="chk_${item.id}" class="text-xs text-slate-700 cursor-pointer">
                        <span class="font-medium block text-slate-800">${item.nombre}</span>
                        <span class="text-slate-400">Código: ${item.codigo}</span>
                    </label>
                `;
                contenedor.appendChild(div);
            });

            renderTabla();
        }

        function toggleSeleccion(id) {
            if (seleccionados.includes(id)) {
                seleccionados = seleccionados.filter(i => i !== id);
            } else {
                seleccionados.push(id);
            }
            renderTabla();
        }

        function renderTabla() {
            const modelo = document.getElementById("selectModelo").value;
            const mostrarPVP = document.getElementById("togglePVP").checked;
            const items = baseDeDatos[modelo].filter(i => seleccionados.includes(i.id));

            const body = document.getElementById("bodyTabla");
            const foot = document.getElementById("footTabla");
            const colHeaderPVP = document.getElementById("colHeaderPVP");

            // Mostrar u ocultar cabecera de PVP
            if (mostrarPVP) {
                colHeaderPVP.classList.remove("hidden");
            } else {
                colHeaderPVP.classList.add("hidden");
            }

            body.innerHTML = "";
            let total = 0;

            if (items.length === 0) {
                body.innerHTML = `<tr><td colspan="4" class="py-4 text-center text-slate-400">No has seleccionado ninguna aplicación.</td></tr>`;
                foot.innerHTML = "";
                return;
            }

            items.forEach((item, index) => {
                total += item.pvp;
                const row = document.createElement("tr");
                row.className = "border-b border-slate-100 hover:bg-slate-50";
                
                row.innerHTML = `
                    <td class="py-3 px-4 font-medium">${index + 1}</td>
                    <td class="py-3 px-4 font-medium text-slate-800">${item.nombre}</td>
                    <td class="py-3 px-4 font-mono text-xs text-slate-500">${item.codigo}</td>
                    ${mostrarPVP ? `<td class="py-3 px-4 text-right font-medium text-slate-700">$ ${item.pvp.toLocaleString('en-US', {minimumFractionDigits: 2})}</td>` : ''}
                `;
                body.appendChild(row);
            });

            // Fila Total
            if (mostrarPVP) {
                foot.innerHTML = `
                    <tr>
                        <td colspan="3" class="py-3 px-4 text-right">Total PVP:</td>
                        <td class="py-3 px-4 text-right text-blue-600 font-bold">$ ${total.toLocaleString('en-US', {minimumFractionDigits: 2})}</td>
                    </tr>
                `;
            } else {
                foot.innerHTML = "";
            }
        }

        function copiarResumen() {
            alert("¡Configuración copiada al portapapeles!");
        }

        // Inicializar al cargar
        cargarComponentes();
    </script>
</body>
</html>
