<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Configurador Ecógrafos Fujifilm - PERFETECH</title>
    <!-- Tailwind CSS para diseño moderno -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Librería para exportar a Excel real (.xlsx) -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
</head>
<body class="bg-slate-100 min-h-screen p-3 md:p-6 font-sans">

    <div class="max-w-[1700px] mx-auto space-y-6">
        
        <!-- Encabezado Principal -->
        <header class="bg-white p-6 rounded-2xl shadow-sm border border-slate-200 flex flex-col md:flex-row justify-between items-start md:items-center gap-4">
            <div>
                <div class="flex items-center space-x-3">
                    <span class="bg-emerald-600 text-white font-bold text-xs px-2.5 py-1 rounded-md uppercase tracking-wider">FUJIFILM</span>
                    <h1 class="text-2xl font-bold text-slate-800">PORTAFOLIO ULTRASONIDO</h1>
                </div>
                <p class="text-slate-500 text-sm mt-1">CONFIGURACIÓN ULTRASONIDO | PERFECTECH S.A</p>
            </div>
            
            <!-- Controles Superiores: Toggle PVP -->
            <div class="flex items-center space-x-4 bg-slate-50 p-3 rounded-xl border border-slate-200">
                <span class="text-xs md:text-sm font-semibold text-slate-700">Mostrar PVP en la tabla comercial</span>
                <label class="relative inline-flex items-center cursor-pointer">
                    <input type="checkbox" id="togglePVP" class="sr-only peer" checked onchange="renderTabla()">
                    <div class="w-11 h-6 bg-slate-300 peer-focus:outline-none rounded-full peer peer-checked:after:translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:border-slate-300 after:border after:rounded-full after:h-5 after:w-5 after:transition-all peer-checked:bg-blue-600"></div>
                </label>
            </div>
        </header>

        <!-- Layout de 3 Columnas -->
        <div class="grid grid-cols-1 lg:grid-cols-12 gap-6">

            <!-- COLUMNA 1 (Izquierda): Visor de PDF con Google Docs -->
            <div class="lg:col-span-4 bg-white p-5 rounded-2xl shadow-sm border border-slate-200 flex flex-col h-[780px]">
                <div class="flex justify-between items-center pb-3 border-b border-slate-100 mb-3">
                    <h2 class="text-xs font-bold text-slate-500 uppercase tracking-wider">📄 Documento PDF: <span id="tituloDocActual" class="text-blue-600">Arietta 50</span></h2>
                    <span class="bg-emerald-50 text-emerald-700 text-[10px] font-bold px-2 py-0.5 rounded">Visor Integrado</span>
                </div>

                <!-- Iframe usando el visor de Google para forzar la visualización en lugar de descarga -->
                <div class="flex-1 overflow-hidden rounded-xl border border-slate-200 bg-slate-50">
                    <iframe id="pdfViewer" src="" class="w-full h-full border-0"></iframe>
                </div>
            </div>

            <!-- COLUMNA 2 (Centro): Selección y Filtros -->
            <div class="lg:col-span-4 bg-white p-5 rounded-2xl shadow-sm border border-slate-200 space-y-4 flex flex-col h-[780px]">
                <div>
                    <label class="block text-xs font-bold text-slate-500 uppercase tracking-wider mb-2">1. Modelo de Ecógrafo</label>
                    <select id="selectModelo" onchange="cargarComponentes()" class="w-full p-2.5 border border-slate-300 rounded-xl focus:ring-2 focus:ring-blue-500 font-semibold text-slate-800 bg-slate-50 text-sm">
                        <option value="Arietta 50">Arietta 50</option>
                        <option value="Arietta 50 LE">Arietta 50 LE</option>
                        <option value="Arietta 65">Arietta 65</option>  
                        <option value="Arietta 650 DI">Arietta 650 DI</option>
                        <option value="Arietta 750 SE">Arietta 750 SE</option>
                        <option value="Arietta 750 DI">Arietta 750 DI</option>
                        <option value="Arietta 850">Arietta 850</option>
                        <option value="Arietta 850 DI">Arietta 850 DI</option>
                        <option value="Lisendo 880">Lisendo 880</option>
                    </select>
                </div>

                <div>
                    <input type="text" id="busquedaInput" oninput="filtrarComponentes()" placeholder="🔍 Buscar por nombre o código" class="w-full p-2 text-sm border border-slate-200 rounded-lg focus:ring-2 focus:ring-blue-500">
                </div>

                <div class="flex-1 flex flex-col min-h-0">
                    <div class="flex justify-between items-center mb-2">
                        <label class="text-xs font-bold text-slate-500 uppercase tracking-wider">2. Seleccionar Opciones / Sondas</label>
                        <span id="contadorItems" class="text-xs text-slate-400">0 disponibles</span>
                    </div>
                    
                    <div id="listaCheckboxes" class="space-y-2 flex-1 overflow-y-auto pr-1 border border-slate-100 p-2 rounded-xl bg-slate-50">
                        <!-- Checkboxes dinámicos -->
                    </div>
                </div>
            </div>

            <!-- COLUMNA 3 (Derecha): Tabla Comercial Grande -->
            <div class="lg:col-span-4 bg-white p-5 rounded-2xl shadow-sm border border-slate-200 flex flex-col justify-between h-[780px]">
                
                <div class="space-y-4 flex-1 flex flex-col min-h-0">
                    <div class="flex flex-col sm:flex-row justify-between sm:items-center gap-2 border-b border-slate-100 pb-3">
                        <div>
                            <h2 class="text-sm font-bold text-slate-800">Configuración</h2>
                            <p id="subtituloModelo" class="text-[11px] text-slate-500">Modelo: Arietta 50</p>
                        </div>
                        
                        <!-- Botones Exportación -->
                        <div class="flex items-center space-x-1.5">
                            <button onclick="exportarExcel()" class="bg-emerald-600 hover:bg-emerald-700 text-white text-[11px] font-semibold px-2.5 py-2 rounded-lg flex items-center space-x-1 shadow-sm transition-all">
                                <span>📊 Excel</span>
                            </button>
                            <button onclick="copiarTabla()" class="bg-slate-800 hover:bg-slate-900 text-white text-[11px] font-semibold px-2.5 py-2 rounded-lg flex items-center space-x-1 shadow-sm transition-all">
                                <span>📋 Copiar</span>
                            </button>
                        </div>
                    </div>

                    <!-- Tabla Principal -->
                    <div class="flex-1 overflow-y-auto rounded-xl border border-slate-200">
                        <table class="w-full text-xs text-left text-slate-600 border-collapse">
                            <thead class="text-[11px] text-slate-700 uppercase bg-slate-100 border-b border-slate-200 font-semibold sticky top-0">
                                <tr>
                                    <th class="py-2.5 px-2 text-center w-8">#</th>
                                    <th class="py-2.5 px-3">Componente / Aplicación</th>
                                    <th class="py-2.5 px-3">Código</th>
                                    <th id="colHeaderPVP" class="py-2.5 px-3 text-right">PVP ($)</th>
                                </tr>
                            </thead>
                            <tbody id="bodyTabla" class="divide-y divide-slate-100">
                                <!-- Filas dinámicas -->
                            </tbody>
                        </table>
                    </div>

                    <!-- Total inferior de la tabla -->
                    <div id="footTabla" class="p-3 bg-slate-50 border border-slate-200 rounded-xl flex justify-between items-center font-bold text-slate-800 text-xs">
                        <!-- Total dinámico -->
                    </div>
                </div>

                <div class="text-[11px] text-slate-400 text-center pt-3 border-t border-slate-100 mt-3">
                    PERFETECH S.A. — FUJIFILM
                </div>

            </div>

        </div>
    </div>

    <script>
        // Enlaces directos a tus archivos PDF en GitHub (reemplaza .docx por .pdf en los nombres)
        const documentosPDF = {
                    "Arietta 50": "https://fsbastidas.github.io/ULTRASOUND-FJ/Cotización ARIETTA 50.pdf#toolbar=0&view=FitH",
                    "Arietta 50 LE": "https://fsbastidas.github.io/ULTRASOUND-FJ/Cotización ARIETTA 50 LE.pdf#toolbar=0&view=FitH",
                    "Arietta 65": "https://fsbastidas.github.io/ULTRASOUND-FJ/Cotización ARIETTA 65.pdf#toolbar=0&view=FitH",
                    "Arietta 650 DI": "https://fsbastidas.github.io/ULTRASOUND-FJ/Cotización ARIETTA 650 DI.pdf#toolbar=0&view=FitH",
                    "Arietta 750 SE": "https://fsbastidas.github.io/ULTRASOUND-FJ/Cotización ARIETTA 750 SE.pdf#toolbar=0&view=FitH",
                    "Arietta 750 DI": "https://fsbastidas.github.io/ULTRASOUND-FJ/Cotización ARIETTA 750 DI.pdf#toolbar=0&view=FitH",
                    "Arietta 850": "https://fsbastidas.github.io/ULTRASOUND-FJ/Cotización ARIETTA 850.pdf#toolbar=0&view=FitH",
                    "Arietta 850 DI": "https://fsbastidas.github.io/ULTRASOUND-FJ/Cotización ARIETTA 850 DI.pdf#toolbar=0&view=FitH",
                    "Lisendo 880": "https://fsbastidas.github.io/ULTRASOUND-FJ/Cotización LISENDO 880.pdf#toolbar=0&view=FitH"
                };
        
        const baseDeDatos = {
            "Arietta 50": [
                { id: "PEU-ARIETTA50", nombre: "Physiological Signal Display Unit", codigo: "PEU-ARIETTA50", pvp: 1565 },
                { id: "MP-FX-AR50-2", nombre: "Probe Holder Left Side Mounting Kit", codigo: "MP-FX-AR50-2", pvp: 20869 },
                { id: "MP-2819", nombre: "Triple Foot Switch", codigo: "MP-2819", pvp: 2783 },
                { id: "MP-FX-AR50-3", nombre: "Storage Tray", codigo: "MP-FX-AR50-3", pvp: 5739 },
                { id: "MP-FX-ALB-6B", nombre: "Keyboard Tray", codigo: "MP-FX-ALB-6B", pvp: 6435 },
                { id: "EU-9203", nombre: "Servo unit", codigo: "EU-9203", pvp: 2956 },
                { id: "EU-6065", nombre: "Battery unit", codigo: "EU-6065", pvp: 2608 },
                { id: "MP-FX-AR50-4", nombre: "Friction Kit", codigo: "MP-FX-AR50-4", pvp: 522 },
                { id: "PM-AR50-H001", nombre: "B/W Printer Connection Kit", codigo: "PM-AR50-H001", pvp: 348 },
                { id: "MP-FX-AR50-20", nombre: "Mounting Rack of B/W Printer", codigo: "MP-FX-AR50-20", pvp: 348 },
                { id: "MP-PH-AVA-11B", nombre: "Endo-cavity Probe holder kit", codigo: "MP-PH-AVA-11B", pvp: 522 },
                { id: "SOP-AR50-5", nombre: "FAM software", codigo: "SOP-AR50-5", pvp: 348 },
                { id: "SOP-AR50-10", nombre: "DICOM Network Communication Software", codigo: "SOP-AR50-10", pvp: 2956 },
                { id: "SOP-AR50-21", nombre: "DICOM Structure Report Software", codigo: "SOP-AR50-21", pvp: 1391 },
                { id: "SOP-AR50-59", nombre: "DICOM Query/Retrieve software", codigo: "SOP-AR50-59", pvp: 1391 },
                { id: "SOP-AR50-7", nombre: "FLOW Profile Measurement software", codigo: "SOP-AR50-7", pvp: 522 }
            ],
            "Arietta 50 LE": [
                { id: "SSD-ARIETTA50LE", nombre: "Ultrasound System, 4 Probe Connector, Flexible Monitor Arm", codigo: "SSD-ARIETTA50LE", pvp: 20869 },
                { id: "C253", nombre: "Convex Probe (1-5MHz)", codigo: "C253", pvp: 2783 },
                { id: "C41V1", nombre: "Transvaginal Probe (Smart Connector EUP-V73W)", codigo: "C41V1", pvp: 6435 },
                { id: "SOP-AR50-10", nombre: "DICOM Network Communication Software", codigo: "SOP-AR50-10", pvp: 2956 }
            ],
            "Arietta 65": [
                { id: "SSD-ARIETTA650(OLED)", nombre: "Ultrasound System (OLED Monitor)", codigo: "SSD-ARIETTA650(OLED)", pvp: 45216 },
                { id: "EU-9198", nombre: "CW servo unit", codigo: "EU-9198", pvp: 1391 },
                { id: "C253", nombre: "Convex Probe (1-5MHz)", codigo: "C253", pvp: 2783 }
            ],
            "Arietta 750 SE": [
                { id: "SSD-ARIETTA750 SE", nombre: "Ultrasound System (23\" LCD)", codigo: "SSD-ARIETTA750 SE", pvp: 59998 },
                { id: "SOP-ARIETTA750-151", nombre: "Shear Wave Measurement B software", codigo: "SOP-ARIETTA750-151", pvp: 21564 },
                { id: "C253", nombre: "Convex Probe (1-5MHz)", codigo: "C253", pvp: 2783 }
            ],
            "Arietta 850": [
                { id: "SSD-ARIETTA750 SE", nombre: "Ultrasound System (23\" LCD)", codigo: "SSD-ARIETTA750 SE", pvp: 59998 },
                { id: "VC35", nombre: "RT-3D (4D) Probe", codigo: "VC35", pvp: 12173 }
            ],
            "Lisendo 880": [
                { id: "SSD-ARIETTA750 SE", nombre: "Ultrasound System (23\" LCD)", codigo: "SSD-ARIETTA750 SE", pvp: 59998 },
                { id: "SOP-ARIETTA750-4", nombre: "Real-time 3D Software", codigo: "SOP-ARIETTA750-4", pvp: 522 }
            ]
        };

        ["Arietta 650 DI", "Arietta 750 DI", "Arietta 850 DI"].forEach(m => {
            baseDeDatos[m] = baseDeDatos["Arietta 50"];
        });

        let seleccionados = [];

        function cargarComponentes() {
            const modelo = document.getElementById("selectModelo").value;
            document.getElementById("subtituloModelo").textContent = "Modelo: " + modelo;
            document.getElementById("tituloDocActual").textContent = modelo;
            
            // Cargar el PDF correspondiente
            const visor = document.getElementById("pdfViewer");
            visor.src = documentosPDF[modelo] || documentosPDF["Arietta 50"];

            const items = baseDeDatos[modelo] || [];
            seleccionados = [];

            renderListaCheckboxes();
            renderTabla();
        }

        function renderListaCheckboxes() {
            const modelo = document.getElementById("selectModelo").value;
            const busqueda = document.getElementById("busquedaInput").value.toLowerCase();
            const items = baseDeDatos[modelo] || [];
            const contenedor = document.getElementById("listaCheckboxes");
            contenedor.innerHTML = "";

            const filtrados = items.filter(item => 
                item.nombre.toLowerCase().includes(busqueda) || item.codigo.toLowerCase().includes(busqueda)
            );

            document.getElementById("contadorItems").textContent = filtrados.length + " encontrados";

            if (filtrados.length === 0) {
                contenedor.innerHTML = `<p class="text-xs text-slate-400 p-3 text-center">No hay ítems con ese criterio.</p>`;
                return;
            }

            filtrados.forEach(item => {
                const isChecked = seleccionados.includes(item.id) ? "checked" : "";
                const div = document.createElement("div");
                div.className = "flex items-start space-x-2.5 p-2 bg-white hover:bg-slate-100 rounded-lg border border-slate-100 cursor-pointer";
                div.innerHTML = `
                    <input type="checkbox" id="chk_${item.id}" value="${item.id}" ${isChecked} onchange="toggleSeleccion('${item.id}')" class="mt-0.5 h-4 w-4 text-blue-600 rounded border-slate-300 focus:ring-blue-500">
                    <label for="chk_${item.id}" class="text-xs cursor-pointer flex-1">
                        <span class="font-bold text-slate-800 block">${item.nombre}</span>
                        <span class="font-mono bg-slate-100 px-1 py-0.5 rounded text-[10px] text-slate-500">${item.codigo}</span>
                    </label>
                `;
                contenedor.appendChild(div);
            });
        }

        function filtrarComponentes() {
            renderListaCheckboxes();
        }

        function toggleSeleccion(id) {
            if (seleccionados.includes(id)) {
                seleccionados = seleccionados.filter(i => i !== id);
            } else {
                seleccionados.push(id);
            }
            renderTabla();
        }

        function renderTabla() {
            const modelo = document.getElementById("selectModelo").value;
            const mostrarPVP = document.getElementById("togglePVP").checked;
            const todosLosItems = baseDeDatos[modelo] || [];
            const items = todosLosItems.filter(i => seleccionados.includes(i.id));

            const body = document.getElementById("bodyTabla");
            const foot = document.getElementById("footTabla");
            const colHeaderPVP = document.getElementById("colHeaderPVP");

            if (mostrarPVP) {
                colHeaderPVP.classList.remove("hidden");
            } else {
                colHeaderPVP.classList.add("hidden");
            }

            body.innerHTML = "";
            let total = 0;

            if (items.length === 0) {
                body.innerHTML = `<tr><td colspan="4" class="py-6 text-center text-slate-400 text-xs">Selecciona al menos un componente en el panel central.</td></tr>`;
                foot.innerHTML = `<span class="text-xs text-slate-400">Total: $0.00</span>`;
                return;
            }

            items.forEach((item, index) => {
                total += item.pvp;
                const row = document.createElement("tr");
                row.className = "hover:bg-slate-50 transition-colors";
                
                row.innerHTML = `
                    <td class="py-2.5 px-2 text-center text-xs font-bold text-slate-400">${index + 1}</td>
                    <td class="py-2.5 px-3 font-semibold text-slate-800">${item.nombre}</td>
                    <td class="py-2.5 px-3 font-mono text-[11px] text-slate-500">${item.codigo}</td>
                    ${mostrarPVP ? `<td class="py-2.5 px-3 text-right font-medium text-slate-700">$ ${item.pvp.toLocaleString('en-US', {minimumFractionDigits: 2})}</td>` : ''}
                `;
                body.appendChild(row);
            });

            if (mostrarPVP) {
                foot.innerHTML = `
                    <span class="text-xs">TOTAL PVP:</span>
                    <span class="text-blue-600 text-sm">$ ${total.toLocaleString('en-US', {minimumFractionDigits: 2})}</span>
                `;
            } else {
                foot.innerHTML = `<span class="text-xs text-slate-400">Configuración sin precios visibles</span>`;
            }
        }

        function exportarExcel() {
                    const modelo = document.getElementById("selectModelo").value;
                    const mostrarPVP = document.getElementById("togglePVP").checked;
                    const todosLosItems = baseDeDatos[modelo] || [];
                    const items = todosLosItems.filter(i => seleccionados.includes(i.id));
        
                    if (items.length === 0) {
                        alert("Selecciona al menos un ítem antes de exportar.");
                        return;
                    }
        
                    // Crear filas con columnas estrictamente separadas
                    const rows = items.map((item, idx) => {
                        let rowData = {
                            "Item": idx + 1,
                            "Descripción": item.nombre,
                            "Código": item.codigo
                        };
                        if (mostrarPVP) rowData["PVP ($)"] = item.pvp;
                        return rowData;
                    });
        
                    if (mostrarPVP) {
                        const total = items.reduce((acc, curr) => acc + curr.pvp, 0);
                        rows.push({
                            "Item": "",
                            "Descripción": "TOTAL DE LA CONFIGURACIÓN",
                            "Código": "",
                            "PVP ($)": total
                        });
                    }
        
                    const worksheet = XLSX.utils.json_to_sheet(rows);
        
                    // Ajustar automáticamente el ancho de las columnas para que no se encimen los textos
                    const colWidths = [
                        { wch: 6 },  // Item
                        { wch: 45 }, // Descripción (más ancho para los nombres largos)
                        { wch: 20 }, // Código
                        { wch: 15 }  // PVP
                    ];
                    worksheet['!cols'] = colWidths;
        
                    const workbook = XLSX.utils.book_new();
                    XLSX.utils.book_append_sheet(workbook, worksheet, "Configuracion");
                    XLSX.writeFile(workbook, `Configuracion_${modelo.replace(/[^a-zA-Z0-9]/g, "_")}.xlsx`);
                }
        function copiarTabla() {
            const modelo = document.getElementById("selectModelo").value;
            const mostrarPVP = document.getElementById("togglePVP").checked;
            const todosLosItems = baseDeDatos[modelo] || [];
            const items = todosLosItems.filter(i => seleccionados.includes(i.id));

            if (items.length === 0) {
                alert("No hay ítems para copiar.");
                return;
            }

            let texto = `CONFIGURACIÓN DE ECÓGRAFO - ${modelo}\n\n`;
            texto += `Ítem\tDescripción / Aplicación\tCódigo / Modelo` + (mostrarPVP ? `\tPVP ($)\n` : `\n`);

            let total = 0;
            items.forEach((item, idx) => {
                total += item.pvp;
                texto += `${idx + 1}\t${item.nombre}\t${item.codigo}` + (mostrarPVP ? `\t$${item.pvp.toFixed(2)}\n` : `\n`);
            });

            if (mostrarPVP) texto += `\nTOTAL CONFIGURACIÓN: $${total.toFixed(2)}`;

            navigator.clipboard.writeText(texto).then(() => {
                alert("¡Configuración copiada al portapapeles con éxito!");
            });
        }

        window.onload = cargarComponentes;
    </script>
</body>
</html>
